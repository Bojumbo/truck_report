<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Рейс Контроль</title><style>:root{--navy:#153b66;--blue:#1976d2;--bg:#f4f7fb;--line:#dde4ed;--muted:#617087;--red:#b73340}*{box-sizing:border-box}body{margin:0;font:15px/1.45 Segoe UI,Arial,sans-serif;background:var(--bg);color:#172033}.top{background:var(--navy);color:#fff;padding:13px max(20px,calc((100% - 1050px)/2));display:flex;align-items:center}.brand{font-weight:800;font-size:19px}.brand small{display:block;font-size:10px;opacity:.7;letter-spacing:1px}.top button{margin-left:auto;background:#ffffff20;color:#fff;border:0;border-radius:7px;padding:9px 13px;cursor:pointer}.wrap{max-width:1050px;margin:35px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:23px;box-shadow:0 3px 16px #18324b09}.auth{max-width:430px;margin:50px auto}.auth h1{margin:0 0 4px}.muted{color:var(--muted)}.view{display:none}.view.active{display:block}.fields{display:grid;gap:13px}.two{grid-template-columns:repeat(2,1fr)}label{font-weight:650;font-size:13px;display:grid;gap:5px}input,select{padding:10px;border:1px solid #c8d2df;border-radius:7px;font:inherit}button{font:inherit;cursor:pointer}.primary{background:var(--blue);color:#fff;border:0;padding:11px 15px;border-radius:8px;font-weight:700}.secondary{background:#e9f1fa;color:var(--navy);border:0;padding:10px 13px;border-radius:8px;font-weight:700}.error{background:#fff0f1;color:var(--red);padding:10px;border-radius:7px;margin:12px 0}.tabs{display:flex;gap:16px;margin:16px 0;border-bottom:1px solid var(--line)}.tabs button{background:none;border:0;padding:10px 2px;color:var(--muted)}.tabs button.active{color:var(--blue);border-bottom:2px solid var(--blue);font-weight:700}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.hero h1{margin:0}.grid{display:grid;grid-template-columns:2fr 1fr;gap:15px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;text-align:left;border-bottom:1px solid var(--line)}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.hidden{display:none}@media(max-width:650px){.two,.grid{grid-template-columns:1fr}.wrap{margin:20px auto}.hero{align-items:start;gap:10px}}</style></head><body><header class="top"><div class="brand">Рейс Контроль<small>облік вантажних рейсів</small></div><button id="logout" class="hidden" onclick="logout()">Вийти</button></header><main class="wrap">
<section id="auth" class="view active auth"><div class="card"><h1>Вхід</h1><p class="muted">Увійдіть за email і паролем, які надав адміністратор.</p><div id="message"></div><form id="loginForm"><div class="fields"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Пароль<input id="password" type="password" required autocomplete="current-password"></label></div><button class="primary" style="width:100%;margin-top:18px">Увійти</button></form><div class="tabs"><button class="active" onclick="showRegister(false,this)">Вхід</button><button onclick="showRegister(true,this)">Реєстрація водія</button></div><form id="registerForm" class="hidden"><div class="fields two"><label>Ім’я<input id="firstName" required></label><label>Прізвище<input id="lastName" required></label><label>Email<input id="regEmail" type="email" required></label><label>Телефон<input id="phone" required></label></div><button class="primary" style="width:100%;margin-top:18px">Подати заявку</button></form></div></section>
<section id="driver" class="view"><div class="hero"><div><h1>Кабінет водія</h1><p class="muted" id="driverName"></p></div><button class="secondary" onclick="loadTrip()">Оновити</button></div><div id="driverContent"></div></section>
<section id="admin" class="view"><div class="hero"><div><h1>Панель адміністратора</h1><p class="muted" id="adminName"></p></div><button class="secondary" onclick="loadDrivers()">Оновити</button></div><div class="card"><h2>Водії</h2><table class="table"><thead><tr><th>Водій</th><th>Email</th><th>Телефон</th><th>Статус</th><th>Дія</th></tr></thead><tbody id="drivers"></tbody></table></div></section></main>
<script>let token=sessionStorage.token,user=JSON.parse(sessionStorage.user||'null');const $=x=>document.querySelector(x);function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active')}function msg(t=''){message.innerHTML=t?`<div class="error">${t}</div>`:''}function showRegister(on,b){loginForm.classList.toggle('hidden',on);registerForm.classList.toggle('hidden',!on);document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');msg()}async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Помилка сервера');return d}async function login(e){e.preventDefault();msg();try{let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});token=d.token;user=d.user;sessionStorage.token=token;sessionStorage.user=JSON.stringify(user);start()}catch(e){msg(e.message)}}async function register(e){e.preventDefault();msg();try{await api('/api/auth/register',{method:'POST',body:JSON.stringify({firstName:firstName.value,lastName:lastName.value,email:regEmail.value,phone:phone.value})});msg('Заявку прийнято. Після підтвердження адміністратор надасть пароль.')}catch(e){msg(e.message)}}function start(){document.getElementById('logout').classList.remove('hidden');if(user.role==='admin'){adminName.textContent=user.name;show('admin');loadDrivers()}else{driverName.textContent=user.name;show('driver');loadTrip()}}function logout(){sessionStorage.clear();token=null;user=null;document.getElementById('logout').classList.add('hidden');show('auth');loginForm.reset()}async function loadDrivers(){try{let data=await api('/api/admin/drivers');drivers.innerHTML=data.length?data.map(x=>`<tr><td>${x.first_name} ${x.last_name}</td><td>${x.email}</td><td>${x.phone}</td><td>${x.approved?'Активний':'Очікує підтвердження'}</td><td>${x.approved?'—':`<button class="primary" onclick="approveDriver('${x.id}')">Підтвердити</button>`}</td></tr>`).join(''):'<tr><td colspan="5">Зареєстрованих водіїв ще немає.</td></tr>'}catch(e){alert(e.message)}}async function approveDriver(id){let password=prompt('Встановіть початковий пароль для водія (мінімум 8 символів):');if(password===null)return;if(password.length<8){alert('Пароль має містити щонайменше 8 символів.');return}try{await api('/api/admin/drivers/'+id,{method:'PATCH',body:JSON.stringify({approved:true,password})});alert('Водія підтверджено. Передайте йому встановлений пароль.');loadDrivers()}catch(e){alert(e.message)}}async function loadTrip(){try{let trip=await api('/api/trips/current');if(trip){driverContent.innerHTML=`<div class="card"><h2>Активний рейс</h2><p class="muted">${trip.truck_name} · ${trip.truck_number} · ${trip.trailer_type}</p><p style="margin-top:12px">Причіп: ${trip.trailer_name||'—'} · Номер: ${trip.trailer_number||'—'}</p><p>Одометр на старті: ${trip.opening_odometer} км · ДП тягача: ${trip.opening_truck_fuel} л${trip.trailer_type==='Рефрижератор'?` · ДП рефа: ${trip.opening_reef_fuel} л`:''}</p></div>`;return}driverContent.innerHTML='<div class="card"><h2>Рейсів ще немає</h2><p class="muted">Відкрийте перший рейс, щоб почати облік.</p><button class="primary" style="margin-top:14px" onclick="openTrip()">Відкрити рейс</button></div>'}catch(e){driverContent.innerHTML=`<div class="error">${e.message}</div>`}}function openTrip(){driverContent.innerHTML=`<div class="card"><h2>Відкрити рейс</h2><form id="tripForm"><div class="fields two"><label>Тягач<input id="truckName" required></label><label>Номер тягача<input id="truckNumber" required></label><label>Причіп (назва)<input id="trailerName"></label><label>Номер причепа<input id="trailerNumber" required></label><label>Тип причепа<select id="trailerType" onchange="toggleReefFuel()"><option>Тент</option><option>Рефрижератор</option><option>Будка</option></select></label><label>Одометр, км<input id="openingOdometer" type="number" min="0" required></label><label>ДП у тягачі на старті, л<input id="openingTruckFuel" type="number" min="0" step="0.1" required></label><label id="reefFuelField" class="hidden">ДП у рефі на старті, л<input id="openingReefFuel" type="number" min="0" step="0.1"></label></div><button class="primary" style="margin-top:18px">Відкрити рейс</button></form></div>`;tripForm.onsubmit=async e=>{e.preventDefault();try{await api('/api/trips',{method:'POST',body:JSON.stringify({truckName:truckName.value,truckNumber:truckNumber.value,trailerName:trailerName.value,trailerNumber:trailerNumber.value,trailerType:trailerType.value,openingOdometer:openingOdometer.value,openingTruckFuel:openingTruckFuel.value,openingReefFuel:openingReefFuel.value})});loadTrip()}catch(e){alert(e.message)}}}function toggleReefFuel(){let isReef=trailerType.value==='Рефрижератор';reefFuelField.classList.toggle('hidden',!isReef);openingReefFuel.required=isReef}loginForm.onsubmit=login;registerForm.onsubmit=register;if(user&&token)start();</script></body></html>
