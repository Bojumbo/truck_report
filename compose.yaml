services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://trucks:${POSTGRES_PASSWORD}@db:5432/trucks
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8990:3000"
    networks:
      - default
      - trucks_tunnel

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trucks
      POSTGRES_USER: trucks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - trucks_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trucks -d trucks"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  trucks_postgres:

networks:
  trucks_tunnel:
    external: true
    name: trucks_tunnel
