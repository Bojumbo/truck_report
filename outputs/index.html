<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Рейс Контроль</title><style>:root{--n:#153b66;--b:#1976d2;--bg:#f4f7fb;--l:#dce4ef;--m:#62718b;--r:#b73543}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font:15px/1.45 Arial,sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer;min-height:44px}.top{background:var(--n);color:#fff;padding:11px max(14px,calc((100% - 1100px)/2));display:flex;align-items:center}.brand{font-weight:800;font-size:19px}.brand small{display:block;font-size:10px;opacity:.7}.top button{margin-left:auto;background:#ffffff20;color:#fff;padding:8px 13px;border-radius:8px}.wrap{max-width:1100px;margin:25px auto;padding:0 14px}.view{display:none}.view.active{display:block}.card{background:#fff;border:1px solid var(--l);border-radius:13px;padding:18px;box-shadow:0 3px 14px #1630500a}.auth{max-width:430px;margin:45px auto}.muted{color:var(--m)}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.hero h1{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary,.secondary,.danger{padding:10px 13px;border-radius:8px;font-weight:700}.primary{background:var(--b);color:#fff}.secondary{background:#eaf2fb;color:var(--n)}.danger{background:#fff0f1;color:var(--r)}.summary,.grid,.fields{display:grid;gap:12px}.summary{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:2fr 1fr}.fields{grid-template-columns:repeat(2,1fr)}label{font-size:13px;font-weight:700;display:grid;gap:5px}input,select{width:100%;padding:10px;border:1px solid #c8d2df;border-radius:8px;min-height:44px}.hidden{display:none!important}.error{margin:10px 0;padding:10px;background:#fff0f1;color:var(--r);border-radius:8px}.timeline{padding:0;list-style:none}.timeline li{padding:10px 0;border-bottom:1px solid var(--l)}.timeline small{display:block;color:var(--m)}.modalbg{display:none;position:fixed;inset:0;background:#14233788;padding:16px;z-index:5;overflow:auto}.modalbg.open{display:flex;align-items:end}.modal{width:min(680px,100%);margin:auto;background:#fff;border-radius:14px;padding:20px}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.metric{font-size:22px;font-weight:800}@media(max-width:700px){body{font-size:16px}.top{position:sticky;top:0;z-index:4}.wrap{margin:15px auto;padding:0 11px}.summary,.grid,.fields{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.hero .actions{width:100%}.hero .actions button{flex:1}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button{width:100%;min-height:48px}.actions button.primary,.actions button.danger{grid-column:span 2}.card{padding:14px}.modalbg{padding:0}.modal{width:100%;margin:0;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding:18px 14px}.formactions{position:sticky;bottom:0;background:#fff;padding:12px 0}.formactions button{flex:1}}</style></head><body><header class="top"><div class="brand">Рейс Контроль<small>облік вантажних рейсів</small></div><button id="logoutBtn" class="hidden" onclick="logout()">Вийти</button></header><main class="wrap"><section id="auth" class="view active auth"><div class="card"><h1>Вхід</h1><p class="muted">Email і пароль надає адміністратор.</p><div id="notice"></div><form id="loginForm" class="fields"><label>Email<input id="email" type="email" required></label><label>Пароль<input id="password" type="password" required></label><button class="primary">Увійти</button></form><p><button class="secondary" onclick="registration()">Реєстрація водія</button></p></div></section><section id="driver" class="view"><div class="hero"><div><h1>Мій рейс</h1><p id="driverName" class="muted"></p></div><div class="actions"><button class="secondary" onclick="openReport()">PDF-звіт</button><button class="secondary" onclick="loadTrip()">Оновити</button></div></div><div id="content"></div></section><section id="admin" class="view"><div class="hero"><div><h1>Панель адміністратора</h1><p id="adminName" class="muted"></p></div><button class="secondary" onclick="loadDrivers()">Оновити</button></div><div class="card"><h2>Водії</h2><table style="width:100%"><thead><tr><th>Водій</th><th>Email</th><th>Телефон</th><th>Статус</th><th>Дія</th></tr></thead><tbody id="drivers"></tbody></table></div></section></main><div id="modalbg" class="modalbg"><form id="modalform" class="modal"><h2 id="modalTitle"></h2><p id="modalHint" class="muted"></p><div id="modalFields" class="fields"></div><div class="formactions"><button type="button" class="secondary" onclick="closeModal()">Скасувати</button><button class="primary">Зберегти</button></div></form></div><script>let token=sessionStorage.token,user=JSON.parse(sessionStorage.user||'null'),trip=null,events=[];const $=x=>document.querySelector(x);async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Помилка сервера');return d}function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active')}function start(){logoutBtn.classList.remove('hidden');if(user.role==='admin'){adminName.textContent=user.name;show('admin');loadDrivers()}else{driverName.textContent=user.name;show('driver');loadTrip()}}function logout(){sessionStorage.clear();location.reload()}loginForm.onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});token=d.token;user=d.user;sessionStorage.token=token;sessionStorage.user=JSON.stringify(user);start()}catch(e){notice.innerHTML=`<div class="error">${e.message}</div>`}};function registration(){openModal('Реєстрація водія','Після підтвердження адміністратор надасть пароль.',[['Ім’я','text'],['Прізвище','text'],['Email','email'],['Телефон','tel']],async v=>{await api('/api/auth/register',{method:'POST',body:JSON.stringify({firstName:v['Ім’я'],lastName:v['Прізвище'],email:v.Email,phone:v.Телефон})});alert('Заявку прийнято.')})}async function loadTrip(){trip=await api('/api/trips/current');events=trip?await api('/api/trips/'+trip.id+'/events'):[];render()}async function loadDrivers(){let a=await api('/api/admin/drivers');drivers.innerHTML=a.map(x=>`<tr><td>${x.first_name} ${x.last_name}</td><td>${x.email}</td><td>${x.phone}</td><td>${x.approved?'Активний':'Очікує'}</td><td>${x.approved?'—':`<button class="primary" onclick="approve('${x.id}')">Підтвердити</button>`}</td></tr>`).join('')}async function approve(id){let p=prompt('Початковий пароль (мін. 8 символів):');if(!p||p.length<8)return;await api('/api/admin/drivers/'+id,{method:'PATCH',body:JSON.stringify({approved:true,password:p})});loadDrivers()}function label(t){return({transit:'Транзит пустим',transit_start:'Транзит - початок',transit_end:'Транзит - кінець',loading:'Загрузка',unloading:'Розгрузка',fuel:'Заправка',expense:'Інші витрати',trip_closed:'Рейс закрито'})[t]||t}function openModal(title,hint,fields,submit){modalTitle.textContent=title;modalHint.textContent=hint;modalFields.innerHTML=fields.map(([n,t,o,optional])=>`<label>${n}${t==='select'?`<select name="${n}">${o.split('|').map(x=>`<option>${x}</option>`).join('')}</select>`:`<input name="${n}" type="${t}" ${t==='number'?'step="any"':''} ${optional?'':'required'}>`}</label>`).join('');modalform.onsubmit=async e=>{e.preventDefault();try{await submit(Object.fromEntries(new FormData(modalform)));closeModal()}catch(e){alert(e.message)}};modalbg.classList.add('open')}function closeModal(){modalbg.classList.remove('open')}if(token&&user)start();</script><script src="app.js?v=20260821-1"></script></body></html>
