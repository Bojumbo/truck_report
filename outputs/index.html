<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Рейс Контроль</title><style>:root{--navy:#153b66;--blue:#1976d2;--bg:#f4f7fb;--line:#dce4ef;--muted:#62718b;--red:#b73543;--green:#147b57}*{box-sizing:border-box}body{margin:0;font:15px/1.45 Segoe UI,Arial,sans-serif;background:var(--bg);color:#172033}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.top{background:var(--navy);color:#fff;padding:12px max(17px,calc((100% - 1100px)/2));display:flex;align-items:center}.brand{font-weight:800;font-size:19px}.brand small{display:block;font-size:10px;opacity:.7;letter-spacing:1px}.top button{margin-left:auto;background:#ffffff20;color:#fff;border-radius:7px;padding:9px 13px}.wrap{max-width:1100px;margin:27px auto;padding:0 16px}.view{display:none}.view.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:19px;box-shadow:0 3px 15px #162f4b09}.auth{max-width:430px;margin:50px auto}.auth h1,.hero h1{margin:0}.muted{color:var(--muted)}.hero{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:17px}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary,.secondary,.danger{padding:10px 13px;border-radius:8px;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#eaf2fb;color:var(--navy)}.danger{background:#fff0f1;color:var(--red)}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.summary .card{padding:12px}.summary p{margin:0;color:var(--muted);font-size:12px}.metric{font-size:22px;font-weight:800}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:grid;gap:5px;font-size:13px;font-weight:650}input,select,textarea{padding:9px;border:1px solid #c8d2df;border-radius:7px;width:100%}textarea{min-height:65px}.full{grid-column:1/-1}.hidden{display:none!important}.error,.warning{padding:10px;border-radius:7px;margin:10px 0}.error{background:#fff0f1;color:var(--red)}.warning{background:#fff6e3;color:#835e15}.timeline{padding:0;list-style:none}.timeline li{padding:9px 0;border-bottom:1px solid var(--line)}.timeline small{display:block;color:var(--muted)}.modalbg{display:none;position:fixed;inset:0;background:#15243877;padding:18px;z-index:5;overflow:auto}.modalbg.open{display:block}.modal{max-width:680px;margin:30px auto;background:#fff;border-radius:13px;padding:22px}.modal h2{margin:0}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}@media(max-width:700px){.grid,.summary,.fields{grid-template-columns:1fr}.hero{align-items:start}.wrap{margin:18px auto}}</style></head><body><header class="top"><div class="brand">Рейс Контроль<small>облік вантажних рейсів</small></div><button id="logoutBtn" class="hidden" onclick="logout()">Вийти</button></header><main class="wrap">

<script>let token=sessionStorage.token,user=JSON.parse(sessionStorage.user||'null'),trip=null,events=[];const $=s=>document.querySelector(s);function view(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active')}async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Помилка сервера');return d}function message(t){notice.innerHTML=t?`<div class="error">${t}</div>`:''}loginForm.onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});token=d.token;user=d.user;sessionStorage.token=token;sessionStorage.user=JSON.stringify(user);start()}catch(e){message(e.message)}};function start(){logoutBtn.classList.remove('hidden');if(user.role==='admin'){adminName.textContent=user.name;view('admin');loadDrivers()}else{driverName.textContent=user.name;view('driver');loadTrip()}}function logout(){sessionStorage.clear();token=user=null;logoutBtn.classList.add('hidden');view('auth')}function registration(){openModal('Реєстрація водія','Після підтвердження адміністратор надасть пароль.',[['Ім’я','text'],['Прізвище','text'],['Email','email'],['Телефон','tel']],async v=>{await api('/api/auth/register',{method:'POST',body:JSON.stringify({firstName:v['Ім’я'],lastName:v['Прізвище'],email:v.Email,phone:v.Телефон})});alert('Заявку прийнято.')})}async function loadDrivers(){let a=await api('/api/admin/drivers');drivers.innerHTML=a.length?a.map(x=>`<tr><td>${x.first_name} ${x.last_name}</td><td>${x.email}</td><td>${x.phone}</td><td>${x.approved?'Активний':'Очікує'}</td><td>${x.approved?'—':`<button class="primary" onclick="approve('${x.id}')">Підтвердити</button>`}</td></tr>`).join(''):'<tr><td colspan="5">Водіїв немає.</td></tr>'}async function approve(id){let p=prompt('Початковий пароль (не менше 8 символів):');if(!p)return;if(p.length<8)return alert('Мінімум 8 символів');await api('/api/admin/drivers/'+id,{method:'PATCH',body:JSON.stringify({approved:true,password:p})});loadDrivers()}async function loadTrip(){trip=await api('/api/trips/current');events=trip?await api('/api/trips/'+trip.id+'/events'):[];render()}function render(){if(!trip){content.innerHTML='<div class="card"><h2>Немає активного рейсу</h2><p class="muted">Відкрийте рейс, щоб почати облік.</p><p><button class="primary" onclick="newTrip()">Відкрити рейс</button></p></div>';return}let last=events.at(-1)?.payload?.odometer||trip.opening_odometer;content.innerHTML=`<div class="summary"><div class="card"><p>Статус</p><div class="metric">Відкритий</div></div><div class="card"><p>Одометр</p><div class="metric">${last} км</div></div><div class="card"><p>ДП тягача на старті</p><div class="metric">${trip.opening_truck_fuel} л</div></div><div class="card"><p>Причіп</p><div class="metric">${trip.trailer_number||'—'}</div></div></div><div class="grid"><div class="card"><h2>Дії рейсу</h2><div class="actions"><button class="primary" onclick="eventForm('transit')">Транзит пустим</button><button class="secondary" onclick="eventForm('loading')">Загрузка</button><button class="secondary" onclick="eventForm('unloading')">Розгрузка</button><button class="secondary" onclick="eventForm('fuel')">Заправка</button><button class="secondary" onclick="eventForm('expense')">Інші витрати</button><button class="danger" onclick="closeTrip()">Закрити рейс</button></div><h3 style="margin-top:20px">Журнал</h3><ul class="timeline">${events.map(e=>`<li><b>${label(e.type)}</b><small>${new Date(e.occurred_at).toLocaleString('uk-UA')} · ${Object.values(e.payload||{}).filter(Boolean).join(' · ')}</small></li>`).join('')||'<li>Подій ще немає.</li>'}</ul></div><div class="card"><h3>Тягач</h3><p>${trip.truck_name} · ${trip.truck_number}</p><h3 style="margin-top:15px">Причіп</h3><p>${trip.trailer_name||'—'} · ${trip.trailer_number||'—'}<br>${trip.trailer_type}</p>${trip.trailer_type==='Рефрижератор'?`<p style="margin-top:15px">ДП рефа на старті: ${trip.opening_reef_fuel} л</p>`:''}</div></div>`}function label(t){return({transit_start:'Транзит - початок',transit_end:'Транзит - кінець',loading_start:'Загрузка - початок',loading_end:'Загрузка - кінець',unloading_start:'Розгрузка - початок',unloading_end:'Розгрузка - кінець',fuel:'Заправка',expense:'Інша витрата',trip_closed:'Рейс закрито'})[t]||t}function newTrip(){openModal('Відкрити рейс','Заповніть початкові показники.',[['Тягач','text'],['Номер тягача','text'],['Причіп','text'],['Номер причепа','text'],['Тип причепа','select','Тент|Рефрижератор|Будка'],['Одометр, км','number'],['ДП тягача у СМ, л','number'],['ДП рефа у СМ, л','number']],async v=>{if(v['Тип причепа']==='Рефрижератор'&&!v['ДП рефа у СМ, л'])throw Error('Вкажіть ДП рефа');await api('/api/trips',{method:'POST',body:JSON.stringify({truckName:v.Тягач,truckNumber:v['Номер тягача'],trailerName:v.Причіп,trailerNumber:v['Номер причепа'],trailerType:v['Тип причепа'],openingOdometer:v['Одометр, км'],openingTruckFuel:v['ДП тягача у СМ, л'],openingReefFuel:v['ДП рефа у СМ, л']})});loadTrip()})}function eventForm(kind){let c={transit:['Транзит пустим',[['Статус','select','Початок|Кінець'],['Звідки / куди','text'],['Одометр, км','number'],['Коментар','text']]],loading:['Загрузка',[['Статус','select','Початок|Кінець'],['Де вантажимось','text'],['Вантаж','text'],['Температура рефа, °C','number'],['Одометр, км','number']]],unloading:['Розгрузка',[['Статус','select','Початок|Кінець'],['Куди привезли','text'],['Одометр, км','number']]],fuel:['Заправка',[['Джерело','select','База|Картка|Готівка'],['Місце','text'],['ДП у тягач, л','number'],['ДП у реф, л','number'],['AdBlue, л','number'],['Сума','number'],['Валюта','select','UAH|PLN|EUR'],['Одометр, км','number']]],expense:['Інші витрати',[['Коментар','text'],['Сума','number'],['Валюта','select','UAH|PLN|EUR']]]}[kind],types={transit:v=>'transit_'+(v.Статус==='Початок'?'start':'end'),loading:v=>'loading_'+(v.Статус==='Початок'?'start':'end'),unloading:v=>'unloading_'+(v.Статус==='Початок'?'start':'end'),fuel:()=> 'fuel',expense:()=> 'expense'};openModal(c[0],'Дані буде додано до звіту.',c[1],async v=>{await api('/api/trips/'+trip.id+'/events',{method:'POST',body:JSON.stringify({type:types[kind](v),payload:{...v,odometer:v['Одометр, км']||null}})});loadTrip()})}function closeTrip(){openModal('Закрити рейс','Зазначте фінальні показники.',[['Одометр, км','number'],['ДП у тягачі, л','number'],['ДП у рефі, л','number'],['Мотогодини рефа','number']],async v=>{await api('/api/trips/'+trip.id+'/close',{method:'POST',body:JSON.stringify({closingOdometer:v['Одометр, км'],truckFuel:v['ДП у тягачі, л'],reefFuel:v['ДП у рефі, л'],reefHours:v['Мотогодини рефа']})});loadTrip()})}function openReport(){if(!trip)return alert('Спочатку відкрийте рейс.');let w=window.open('','_blank');w.document.write(`<h1>Звітний лист водія</h1><p>${trip.truck_name} · ${trip.truck_number} · ${trip.trailer_number||''}</p><table border="1" cellpadding="7"><tr><th>Дата</th><th>Подія</th><th>Деталі</th></tr>${events.map(e=>`<tr><td>${new Date(e.occurred_at).toLocaleString('uk-UA')}</td><td>${label(e.type)}</td><td>${Object.values(e.payload||{}).filter(Boolean).join(' · ')}</td></tr>`).join('')}</table>`)}function openModal(title,hint,fields,submit){modalTitle.textContent=title;modalHint.textContent=hint;modalFields.innerHTML=fields.map(([n,t,o,optional])=>`<label>${n}${t==='select'?`<select name="${n}">${o.split('|').map(x=>`<option>${x}</option>`).join('')}</select>`:`<input name="${n}" type="${t}" ${t==='number'?'step="any"':''} ${optional?'':'required'}>`}</label>`).join('');modalform.onsubmit=async e=>{e.preventDefault();try{await submit(Object.fromEntries(new FormData(modalform)));closeModal()}catch(e){alert(e.message)}};modalbg.classList.add('open')}function closeModal(){modalbg.classList.remove('open')}if(token&&user)start();</script><script>
function newTrip(){openModal('Відкрити рейс','ДП та мотогодини рефа заповнюються тільки для рефрижератора.',[['Тягач (назва)','text'],['Номер тягача','text'],['ДП тягача у СМ, л','number'],['Причіп (назва)','text'],['Номер причепа','text'],['Вид причепа','select','Рефрижератор|Тент|Будка'],['ДП рефа у СМ, л','number',null,true],['Мотогодини рефа у СМ','number',null,true],['Одометр, км','number'],['Аванс, грн','number'],['Аванс, PLN','number'],['Аванс, EUR','number']],async v=>{let r=v['Вид причепа']==='Рефрижератор';if(r&&(!v['ДП рефа у СМ, л']||!v['Мотогодини рефа у СМ']))throw Error('Для рефрижератора вкажіть ДП та мотогодини');await api('/api/trips',{method:'POST',body:JSON.stringify({truckName:v['Тягач (назва)'],truckNumber:v['Номер тягача'],trailerName:v['Причіп (назва)'],trailerNumber:v['Номер причепа'],trailerType:v['Вид причепа'],openingOdometer:v['Одометр, км'],openingTruckFuel:v['ДП тягача у СМ, л'],openingReefFuel:r?v['ДП рефа у СМ, л']:null,openingReefHours:r?v['Мотогодини рефа у СМ']:null,advanceUah:v['Аванс, грн']||0,advancePln:v['Аванс, PLN']||0,advanceEur:v['Аванс, EUR']||0})});loadTrip()})}
function eventForm(k){let reef=trip.trailer_type==='Рефрижератор',c={start:['Транзит пустим - розпочати',[['Звідки','text'],['Одометр, км','number'],['Коментар','text']],'transit_start'],end:['Транзит пустим - закінчити',[['Куди приїхали','text'],['Одометр, км','number']],'transit_end'],loading:['Загрузка',[['Де грузимось','text'],['Чим грузимось','text'],['Температура рефа, °C','number',null,!reef],['Одометр, км','number']],'loading'],unloading:['Розгрузка',[['Куди привезли','text'],['Одометр, км','number']],'unloading_start'],expense:['Інші витрати',[['Коментар','text'],['Сума','number'],['Валюта','select','UAH|PLN|EUR']],'expense']}[k];if(k==='fuel'){let source=prompt('Де заправляємось: База або Заправка','База');if(!source)return;let f=source==='База'?[['Кількість ДП в тягач, л','number'],['Кількість AdBlue, л','number'],['Кількість ДП в реф, л','number',null,!reef],['Одометр, км','number']]:[['Де заправка','text'],['ДП в тягач, л','number'],['Сума ДП','number'],['Валюта ДП','select','UAH|PLN|EUR'],['Кількість AdBlue, л','number'],['Сума AdBlue','number'],['Валюта AdBlue','select','UAH|PLN|EUR'],['ДП в реф, л','number',null,!reef],['Сума ДП рефа','number',null,!reef],['Валюта ДП рефа','select','UAH|PLN|EUR'],['Одометр, км','number']];return openModal('Заправка: '+source,'Дані заправки потраплять у звіт.',f,async v=>{await api('/api/trips/'+trip.id+'/events',{method:'POST',body:JSON.stringify({type:'fuel',payload:{source,...v,odometer:v['Одометр, км']}})});loadTrip()})}openModal(c[0],'Дані потраплять у звіт.',c[1],async v=>{await api('/api/trips/'+trip.id+'/events',{method:'POST',body:JSON.stringify({type:c[2],payload:{...v,odometer:v['Одометр, км']||null}})});loadTrip()})}
function closeTrip(){let f=[['Одометр, км','number'],['Кількість палива у тягачі, л','number']];if(trip.trailer_type==='Рефрижератор')f.push(['Кількість палива у рефі, л','number'],['Мотогодини рефа','number']);openModal('Закрити рейс','Зазначте фінальні показники.',f,async v=>{await api('/api/trips/'+trip.id+'/close',{method:'POST',body:JSON.stringify({closingOdometer:v['Одометр, км'],truckFuel:v['Кількість палива у тягачі, л'],reefFuel:v['Кількість палива у рефі, л']||null,reefHours:v['Мотогодини рефа']||null})});loadTrip()})}
function render(){if(!trip){content.innerHTML='<div class="card"><h2>Немає активного рейсу</h2><p class="muted">Відкрийте рейс, щоб почати облік.</p><p><button class="primary" onclick="newTrip()">Відкрити рейс</button></p></div>';return}let last=events.at(-1)?.payload?.odometer||trip.opening_odometer;content.innerHTML=`<div class="summary"><div class="card"><p>Статус</p><div class="metric">Відкритий</div></div><div class="card"><p>Одометр</p><div class="metric">${last} км</div></div><div class="card"><p>ДП тягача у СМ</p><div class="metric">${trip.opening_truck_fuel} л</div></div><div class="card"><p>Аванс</p><div class="metric">${trip.advance_uah} ₴</div><small>${trip.advance_pln} PLN · ${trip.advance_eur} EUR</small></div></div><div class="grid"><div class="card"><h2>Дії рейсу</h2><div class="actions"><button class="primary" onclick="eventForm('start')">Транзит - почати</button><button class="secondary" onclick="eventForm('end')">Транзит - закінчити</button><button class="secondary" onclick="eventForm('loading')">Загрузка</button><button class="secondary" onclick="eventForm('unloading')">Розгрузка</button><button class="secondary" onclick="eventForm('fuel')">Заправка</button><button class="secondary" onclick="eventForm('expense')">Інші витрати</button><button class="danger" onclick="closeTrip()">Закрити рейс</button></div><h3 style="margin-top:20px">Журнал</h3><ul class="timeline">${events.map(e=>`<li><b>${label(e.type)}</b><small>${new Date(e.occurred_at).toLocaleString('uk-UA')} · ${Object.values(e.payload||{}).filter(Boolean).join(' · ')}</small></li>`).join('')||'<li>Подій ще немає.</li>'}</ul></div><div class="card"><h3>Автомобіль</h3><p>${trip.truck_name} · ${trip.truck_number}</p><h3 style="margin-top:15px">Причіп</h3><p>${trip.trailer_name||'—'} · ${trip.trailer_number||'—'}<br>${trip.trailer_type}</p>${trip.trailer_type==='Рефрижератор'?`<p>ДП рефа у СМ: ${trip.opening_reef_fuel} л<br>Мотогодини рефа: ${trip.opening_reef_hours}</p>`:''}</div></div>`}</scr
